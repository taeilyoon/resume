<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern A4 Resume Viewer</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --page-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --text-dark: #0f172a;
            --accent: #2563eb;
            --accent-light: #eff6ff;
            --border: #e2e8f0;
            --a4-width: 210mm;
            --page-padding: 20mm 20mm;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 40px 20px;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
            line-height: 1.45;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }
        
        .controls {
            width: var(--a4-width);
            max-width: 100%;
            background: var(--page-bg);
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .controls input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .controls input:focus {
            border-color: var(--accent);
        }
        
        .controls button {
            padding: 10px 20px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        
        .controls button:hover {
            background: #1d4ed8;
        }
        
        .page-container {
            width: var(--a4-width);
            max-width: 100%;
            min-height: 297mm;
            background: var(--page-bg);
            padding: var(--page-padding);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
            border-radius: 4px;
            overflow-x: hidden;
        }
        
        /* Markdown Styles */
        .markdown-body {
            font-size: 10pt;
            color: var(--text-main);
            letter-spacing: -0.015em;
        }
        
        .markdown-body h1, .markdown-body h2, .markdown-body h3, 
        .markdown-body h4, .markdown-body h5, .markdown-body h6 {
            color: var(--text-dark);
            margin-top: 1.2em;
            margin-bottom: 0.4em;
            font-weight: 700;
            line-height: 1.3;
            page-break-after: avoid;
        }

        /* Header Section */
        .markdown-body h1 {
            margin: 0 0 0.2em;
            font-size: 28pt;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-dark);
        }

        .markdown-body h1 + p {
            margin: 0 0 0.8em;
            font-size: 11pt;
            color: var(--text-muted);
            line-height: 1.5;
        }
        
        .markdown-body h1 + p strong {
            display: block;
            font-size: 13pt;
            color: var(--accent);
            margin-bottom: 0.2em;
        }

        /* Contact Info List */
        .markdown-body h1 ~ ul:first-of-type {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4em 1.2em;
            padding: 0;
            margin: 0 0 1.5em 0;
            list-style: none;
            font-size: 9.5pt;
            color: var(--text-muted);
        }

        .markdown-body h1 ~ ul:first-of-type li {
            padding: 0;
            margin: 0;
            display: flex;
            align-items: center;
            color: var(--text-muted);
        }

        .markdown-body h1 ~ ul:first-of-type li::before {
            display: none;
        }

        .markdown-body h1 ~ ul:first-of-type li:not(:last-child)::after {
            content: "|";
            margin-left: 1.2em;
            color: var(--border);
            font-size: 0.9em;
        }

        /* Section Titles */
        .markdown-body h2 {
            margin-top: 1.5em;
            margin-bottom: 0.6em;
            padding-bottom: 0.3em;
            font-size: 14pt;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            border-bottom: 2px solid var(--border);
            display: flex;
            align-items: center;
        }
        
        .markdown-body h2::before {
            content: "";
            display: inline-block;
            width: 5px;
            height: 16px;
            background-color: var(--accent);
            margin-right: 10px;
            border-radius: 2px;
        }

        /* Subsections (Companies/Categories) */
        .markdown-body h3 {
            margin-top: 1.2em;
            margin-bottom: 0.2em;
            font-size: 12pt;
            font-weight: 700;
            color: var(--text-dark);
        }

        /* Roles and Dates (usually p right after h3) */
        .markdown-body h3 + p {
            margin-top: 0;
            margin-bottom: 0.6em;
            font-size: 9.5pt;
            color: var(--text-muted);
            line-height: 1.4;
        }
        
        .markdown-body h3 + p strong {
            color: var(--text-dark);
            font-weight: 600;
            font-size: 10.5pt;
        }

        /* Projects */
        .markdown-body h4 {
            margin-top: 1em;
            margin-bottom: 0.3em;
            font-size: 10.5pt;
            font-weight: 700;
            color: var(--text-dark);
            display: flex;
            align-items: flex-start;
        }
        
        .markdown-body h4::before {
            content: "▸";
            color: var(--accent);
            margin-right: 6px;
            font-size: 1.1em;
            line-height: 1;
            margin-top: 2px;
        }

        .markdown-body p { 
            margin-top: 0; 
            margin-bottom: 0.5em; 
            text-align: justify;
            word-break: keep-all;
            line-height: 1.5;
        }
        
        .markdown-body a { 
            color: var(--accent); 
            text-decoration: none; 
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
            font-weight: 500;
        }
        
        .markdown-body a:hover { 
            border-bottom-color: var(--accent); 
        }
        
        /* Lists */
        .markdown-body ul, .markdown-body ol { 
            margin-top: 0.3em; 
            margin-bottom: 0.8em; 
            padding-left: 0; 
            list-style: none;
        }
        
        .markdown-body li { 
            position: relative;
            padding-left: 16px;
            margin-bottom: 0.2em; 
            word-break: keep-all;
            color: var(--text-main);
        }

        .markdown-body ul > li::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0.65em;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: var(--accent);
            opacity: 0.7;
        }
        
        .markdown-body ol {
            counter-reset: list-counter;
        }
        
        .markdown-body ol > li {
            padding-left: 20px;
        }
        
        .markdown-body ol > li::before {
            content: counter(list-counter) ".";
            counter-increment: list-counter;
            position: absolute;
            left: 0;
            top: 0;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9em;
        }

        .markdown-body strong {
            font-weight: 700;
            color: var(--text-dark);
        }
        
        .markdown-body blockquote {
            margin: 1.5em 0;
            padding: 1em 1.2em;
            color: var(--text-dark);
            background: var(--accent-light);
            border-left: 4px solid var(--accent);
            border-radius: 0 6px 6px 0;
            font-size: 0.95em;
            line-height: 1.6;
        }
        
        .markdown-body blockquote p:last-child {
            margin-bottom: 0;
        }
        
        .markdown-body code {
            padding: 0.2em 0.4em;
            margin: 0 0.1em;
            font-size: 0.85em;
            background-color: var(--bg-color);
            color: var(--accent);
            border-radius: 4px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-weight: 500;
        }
        
        .markdown-body pre {
            padding: 16px;
            overflow: auto;
            font-size: 0.9em;
            line-height: 1.5;
            background-color: #0f172a;
            color: #f8fafc;
            border-radius: 6px;
            margin-bottom: 1.2em;
        }
        
        .markdown-body pre code {
            background-color: transparent;
            color: inherit;
            padding: 0;
        }
        
        .markdown-body table {
            border-spacing: 0;
            border-collapse: collapse;
            margin-bottom: 1.5em;
            width: 100%;
            font-size: 0.95em;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 0 0 1px var(--border);
        }
        
        .markdown-body table th, .markdown-body table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }
        
        .markdown-body table th {
            font-weight: 600;
            color: var(--text-dark);
            background-color: var(--bg-color);
        }
        
        .markdown-body table tr:last-child td {
            border-bottom: none;
        }
        
        .markdown-body hr {
            height: 1px;
            padding: 0;
            margin: 2.5em 0;
            background-color: var(--border);
            border: 0;
        }
        
        .error {
            color: #b91c1c;
            padding: 16px 20px;
            background: #fef2f2;
            border: 1px solid #f87171;
            border-radius: 6px;
            margin-bottom: 20px;
            width: var(--a4-width);
            max-width: 100%;
        }

        @media print {
            body {
                background: none;
                padding: 0;
                display: block;
            }
            .controls {
                display: none;
            }
            .page-container {
                width: 100%;
                max-width: none;
                min-height: 0;
                box-shadow: none;
                border-radius: 0;
                padding: 0;
            }
            @page {
                size: A4;
                margin: 15mm 18mm;
            }
            h1, h2, h3, h4 {
                page-break-after: avoid;
            }
            h2 {
                margin-top: 1.8em;
            }
            img {
                page-break-inside: avoid;
            }
            table, pre, blockquote, ul, ol, li {
                page-break-inside: avoid;
            }
            p {
                orphans: 3;
                widows: 3;
            }
            .markdown-body h2::before {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .markdown-body blockquote {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .markdown-body ul > li::before {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .markdown-body code {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .markdown-body table th {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>

    <div class="controls no-print">
        <input type="text" id="srcInput" placeholder="Markdown file path (e.g., resume.md)" value="resume.md">
        <button onclick="loadMarkdown()">Load</button>
        <button onclick="window.print()">Print / PDF</button>
    </div>

    <div id="errorContainer"></div>

    <div class="page-container">
        <div id="content" class="markdown-body"></div>
    </div>

    <script>
        // Minimal Markdown Parser
        function parseMarkdown(md) {
            // Escape HTML
            md = md.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            
            // Code blocks
            md = md.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code class="language-$1">$2</code></pre>');
            
            // Inline code
            md = md.replace(/`([^`]+)`/g, '<code>$1</code>');
            
            // Bold
            md = md.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            
            // Italic
            md = md.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            
            // Links
            md = md.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
            
            // Horizontal rules
            md = md.replace(/^---$/gm, '<hr>');
            
            // Headings
            md = md.replace(/^###### (.*$)/gm, '<h6>$1</h6>');
            md = md.replace(/^##### (.*$)/gm, '<h5>$1</h5>');
            md = md.replace(/^#### (.*$)/gm, '<h4>$1</h4>');
            md = md.replace(/^### (.*$)/gm, '<h3>$1</h3>');
            md = md.replace(/^## (.*$)/gm, '<h2>$1</h2>');
            md = md.replace(/^# (.*$)/gm, '<h1>$1</h1>');
            
            // Blockquotes
            md = md.replace(/^&gt; (.*$)/gm, '<blockquote>$1</blockquote>');
            
            // Lists
            md = md.replace(/^[ \t]*[-*+] (.*$)/gm, '<ul><li>$1</li></ul>');
            md = md.replace(/<\/ul>\n<ul>/g, '\n');
            
            md = md.replace(/^[ \t]*\d+\. (.*$)/gm, '<ol><li>$1</li></ol>');
            md = md.replace(/<\/ol>\n<ol>/g, '\n');
            
            // Tables
            md = md.replace(/(?:^\|.*\|\n)+/gm, function(match) {
                const lines = match.trim().split('\n');
                if (lines.length < 2) return match;
                
                const header = lines[0].split('|').filter(c => c !== '').map(c => c.trim());
                const separator = lines[1].split('|').filter(c => c !== '').map(c => c.trim());
                
                if (!separator.every(s => s.match(/^:?-+:?$/))) return match;
                
                let html = '<table><thead><tr>';
                header.forEach(h => html += `<th>${h}</th>`);
                html += '</tr></thead><tbody>';
                
                for (let i = 2; i < lines.length; i++) {
                    const row = lines[i].split('|').filter(c => c !== '').map(c => c.trim());
                    if (row.length === 0) continue;
                    html += '<tr>';
                    row.forEach(c => html += `<td>${c}</td>`);
                    html += '</tr>';
                }
                html += '</tbody></table>';
                return html;
            });
            
            // Paragraphs
            let blocks = md.split(/\n\n+/);
            blocks = blocks.map(block => {
                if (block.match(/^(<h|<ul|<ol|<pre|<blockquote|<hr|<table)/)) {
                    return block;
                }
                return '<p>' + block.replace(/\n/g, '<br>') + '</p>';
            });
            
            return blocks.join('\n\n');
        }

        async function loadMarkdown() {
            const input = document.getElementById('srcInput');
            const content = document.getElementById('content');
            const errorContainer = document.getElementById('errorContainer');
            
            let src = input.value.trim();
            if (!src) src = 'resume.md';
            
            // Update URL without reloading
            const url = new URL(window.location);
            url.searchParams.set('src', src);
            window.history.pushState({}, '', url);
            
            try {
                errorContainer.replaceChildren();
                content.innerHTML = '<p>Loading...</p>';
                
                const response = await fetch(src);
                if (!response.ok) {
                    throw new Error(`Failed to load ${src}: ${response.status} ${response.statusText}`);
                }
                
                const text = await response.text();
                content.innerHTML = parseMarkdown(text);
                document.title = `${src} - Modern A4 Viewer`;
            } catch (err) {
                const error = document.createElement('div');
                error.className = 'error';
                error.textContent = err.message;
                errorContainer.replaceChildren(error);
                content.innerHTML = '';
            }
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const srcParam = urlParams.get('src');
            if (srcParam) {
                document.getElementById('srcInput').value = srcParam;
            }
            loadMarkdown();
        });
    </script>
</body>
</html>
